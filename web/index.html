<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korea War</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23b8432f'/%3E%3Cpath d='M4 12V4h2v3l3-3h2.5l-3.4 3.4L12 12H9.6L7 9.2 6 10.2V12z' fill='%23f3e7c9'/%3E%3C/svg%3E">
<style>
:root{--bg:#11151b;--panel:#1b222c;--panel2:#212a35;--line:#2e3946;--ink:#ece6d6;--mute:#97a2ae;--red:#c2452f;--red2:#9a3322;--gold:#d9b25f;--green:#5fb36b;--blurple:#5865f2}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  background:radial-gradient(1100px 520px at 90% -10%,rgba(194,69,47,.17),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(79,134,198,.12),transparent 60%),var(--bg);background-attachment:fixed}
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;gap:16px;padding:18px;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:11px;background:linear-gradient(145deg,var(--red),var(--red2));display:grid;place-items:center;font-weight:900;font-size:21px;color:#f3e7c9;box-shadow:0 6px 18px rgba(194,69,47,.35)}
h1{margin:0;font-size:22px} h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#666}.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.big{font-size:17px;font-weight:800}
.sp{flex:1}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;align-items:center;gap:12px}
.head{width:46px;height:46px;border-radius:9px;background:#3a4654;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.head img{width:100%;height:100%;image-rendering:pixelated}
.who b{font-size:16px}.who div{color:var(--mute);font-size:12px;margin-top:2px}
button{font:inherit;border:0;border-radius:9px;padding:10px 15px;cursor:pointer;color:var(--ink);background:#33404e;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default;filter:none}
.ms{background:#2f6fb5}.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.disc{background:var(--blurple);display:flex;align-items:center;gap:8px}
.play{width:100%;padding:18px;font-size:21px;font-weight:800;letter-spacing:1px;background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 8px 22px rgba(194,69,47,.3)}
.bar{height:9px;background:#0e1217;border-radius:999px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f0d48c);transition:width .25s}
.stat{margin-top:9px;color:var(--mute);font-size:13px;min-height:18px}
.err{margin-top:12px;background:rgba(194,69,47,.12);border:1px solid rgba(194,69,47,.5);border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.5}
pre{white-space:pre-wrap;word-break:break-all;background:#0b0f14;border-radius:7px;padding:9px;font-size:11px;max-height:180px;overflow:auto}
.note{font-size:12.5px;color:var(--mute);line-height:1.6}.warn{border-color:rgba(217,178,95,.5);background:rgba(217,178,95,.08)}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:100px 1fr;gap:10px 12px;align-items:center;margin-top:12px;font-size:13px}
select,input[type=text]{font:inherit;background:#0e1217;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
/* 오른쪽 탭 */
.main{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tab{background:transparent;color:var(--mute);padding:9px 16px}.tab.on{background:#2c3743;color:var(--ink)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
.pane{flex:1;min-height:0;overflow:auto;padding:18px}
.pane[hidden]{display:none}
.notice{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin-bottom:20px}
.notice .d{color:var(--mute);font-size:12px}.notice h3{margin:3px 0 6px;font-size:16px}.notice p{margin:0;line-height:1.65;font-size:14px;white-space:pre-wrap;color:#d8d2c3}
.empty{color:var(--mute);font-size:14px;padding:30px;text-align:center}
/* 지도 */
#mapPane{padding:0;position:relative;overflow:hidden;background:#244a9a;cursor:grab}
#mapPane.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.core{position:absolute;transform:translate(-50%,-50%);pointer-events:auto}
.core i{display:block;width:16px;height:16px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.core span{position:absolute;left:50%;top:13px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;background:rgba(10,14,20,.55);padding:1px 6px;border-radius:5px}
.legend{position:absolute;right:12px;top:12px;background:rgba(15,20,27,.85);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.8;max-width:220px}
.legend b{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:8px;border:1px solid #fff}
.mapbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}.mapbtns button{background:rgba(15,20,27,.85);border:1px solid var(--line);padding:7px 12px}
#tip{position:absolute;pointer-events:none;background:rgba(10,14,20,.92);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;display:none;z-index:5}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}
.pl img{width:32px;height:32px;border-radius:5px;image-rendering:pixelated;background:#3a4654}
.pl small{display:block;font-size:12px}
footer{position:fixed;left:18px;bottom:8px;color:#5f6a76;font-size:11px}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.main{min-height:600px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">KW</div>
    <h1 id="sname">Korea War<small id="addr">서버 확인 중</small></h1>
    <div class="sp"></div>
    <div class="pill"><span class="dot" id="dot"></span><span><span class="big" id="cnt">-</span><span id="cntmax"></span> 명 접속 중</span></div>
    <button class="disc" id="disc" hidden><svg width="18" height="14" viewBox="0 0 71 55" fill="#fff"><path d="M60 4.6A58 58 0 0 0 45.6.2l-1.8 3.7a54 54 0 0 0-16.2 0L25.8.2A58 58 0 0 0 11.3 4.6 59.6 59.6 0 0 0 .9 44.8 58.3 58.3 0 0 0 18.6 53.8l3.8-5.2a38 38 0 0 1-6-2.9l1.5-1.1a41.6 41.6 0 0 0 35.4 0l1.5 1.1a38 38 0 0 1-6 2.9l3.8 5.2a58 58 0 0 0 17.8-9A59.4 59.4 0 0 0 60 4.6ZM23.7 36.7c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.4 3.3 6.4 7.2-2.8 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.4 3.3 6.4 7.2-2.8 7.2-6.4 7.2Z"/></svg>디스코드 참가</button>
  </header>

  <div class="col">
    <div class="card warn" id="noapp" hidden><div class="note"><b>로그인 앱이 아직 설정되지 않았어요.</b><br>서버장이 config.yml 의 launcher.client-id 를 채우면 로그인할 수 있어요.</div></div>
    <div class="card"><div class="row" id="acc"></div><div class="err" id="autherr" hidden></div></div>
    <div class="card">
      <button class="play" id="play" disabled>게임 시작</button>
      <div class="bar"><i id="barv"></i></div>
      <div class="stat" id="stat">&nbsp;</div>
      <div class="err" id="err" hidden></div>
      <div class="note" id="motd" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <details>
        <summary>설정</summary>
        <div class="grid">
          <label for="mem">메모리</label>
          <select id="mem"><option value="2048">2 GB</option><option value="3072">3 GB</option><option value="4096">4 GB (권장)</option><option value="6144">6 GB</option><option value="8192">8 GB</option></select>
          <label for="host">서버 주소</label><input type="text" id="host" spellcheck="false">
          <label for="auto">바로 접속</label><select id="auto"><option value="1">예</option><option value="0">아니요</option></select>
          <span></span>
          <div class="row" style="flex-wrap:wrap;gap:6px"><button id="save">저장</button><button class="ghost" id="folder">게임 폴더</button><button class="ghost" id="quit">런처 끄기</button></div>
        </div>
      </details>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab on" data-t="notice">공지<span class="n" id="ncnt" hidden></span></button>
      <button class="tab" data-t="map">지도</button>
      <button class="tab" data-t="players">접속자</button>
    </div>
    <div class="pane" id="notice"></div>
    <div class="pane" id="mapPane" hidden>
      <div id="world"><img id="mapimg" alt=""><div id="marks"></div></div>
      <div class="legend" id="legend"></div>
      <div class="mapbtns"><button id="zin">＋</button><button id="zout">－</button><button id="zfit">전체</button></div>
      <div id="tip"></div>
    </div>
    <div class="pane" id="players" hidden></div>
  </div>
</div>
<footer id="foot"></footer>
<script>
const TOKEN="__TOKEN__", $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function post(p,b){return (await fetch(p,{method:"POST",headers:{"X-KW-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json()}
let filled=false, info=null, discordUrl="";
// ---------------- 탭
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  ["notice","mapPane","players"].forEach(id=>$(id).hidden=(id!==(b.dataset.t==="map"?"mapPane":b.dataset.t)));
  if(b.dataset.t==="map") fitMap(false);
  if(b.dataset.t==="notice"){ try{localStorage.setItem("kwSeen",String(noticeKey()))}catch(e){} $("ncnt").hidden=true; }
});
// ---------------- 런처 상태
async function tick(){
  let s; try{s=await(await fetch("/api/state",{cache:"no-store"})).json()}catch(e){$("stat").textContent="런처가 꺼져 있어요. 다시 실행해 주세요.";$("play").disabled=true;return}
  $("addr").textContent=s.address; $("noapp").hidden=s.hasClientId;
  const sv=s.server||{}; $("dot").className="dot"+(sv.online?" on":"");
  if(!info){ $("cnt").textContent=sv.online?sv.players:"-"; $("cntmax").textContent=sv.online?" / "+sv.max:""; }
  $("motd").textContent=sv.online?(sv.motd||""):"서버가 꺼져 있어요";
  const a=s.account;
  $("acc").innerHTML=a?`<div class="head"><img alt="" src="https://mc-heads.net/avatar/${esc(a.uuid)}/46" onerror="this.remove()"></div><div class="who"><b>${esc(a.name)}</b><div>마이크로소프트 계정</div></div><div class="sp"></div><button class="ghost" id="logout">로그아웃</button>`
   :`<div class="head">?</div><div class="who"><b>로그인이 필요해요</b><div>마인크래프트 자바 에디션 계정</div></div><div class="sp"></div><button class="ms" id="login" ${s.hasClientId?"":"disabled"}>로그인</button>`;
  if(a)$("logout").onclick=async()=>{await post("/api/logout");tick()};
  else $("login").onclick=async()=>{const r=await post("/api/login");if(r.url)location.href=r.url;else if(r.error){$("autherr").hidden=false;$("autherr").textContent=r.error}};
  $("autherr").hidden=!s.authError; if(s.authError)$("autherr").textContent=s.authError;
  const st=s.status||{}, busy=st.phase==="prepare";
  $("play").disabled=!a||busy||s.running; $("play").textContent=s.running?"게임 실행 중":busy?"준비 중…":"게임 시작";
  $("barv").style.width=(st.total>0?Math.min(100,Math.round(st.done*100/st.total)):(busy?8:(s.running?100:0)))+"%";
  $("stat").textContent=(st.text||"")+(st.total>0&&busy?`  (${st.done}/${st.total})`:"");
  $("err").hidden=!st.error; if(st.error)$("err").innerHTML=esc(st.error)+(st.logTail?`<pre>${esc(st.logTail)}</pre>`:"");
  if(!filled){filled=true;$("mem").value=String(s.config.memoryMB);$("host").value=s.config.host;$("auto").value=s.config.autoJoin?"1":"0"}
  $("foot").textContent=`런처 ${s.version}`+(s.newerLauncher?` · 새 런처 ${s.newerLauncher} 이 있어요`:"")+" · 게임을 켠 뒤엔 이 창을 닫아도 돼요";
}
// ---------------- 서버 정보 (공지·접속자·코어)
function noticeKey(){return info&&info.notices&&info.notices.length?(info.notices[0].date+info.notices[0].title):""}
async function infoTick(){
  let d; try{d=await(await fetch("/api/info",{cache:"no-store"})).json()}catch(e){return}
  if(d.error){ if(!info) $("notice").innerHTML=`<div class="empty">${esc(d.error)}</div>`; return }
  const first=!info; info=d;
  document.title=d.name||"Korea War"; $("sname").firstChild.textContent=d.name||"Korea War";
  $("cnt").textContent=d.online; $("cntmax").textContent=" / "+d.max;
  discordUrl=d.discord||""; $("disc").hidden=!discordUrl;
  const ns=d.notices||[];
  $("notice").innerHTML=ns.length?ns.map(n=>`<div class="notice"><div class="d">${esc(n.date)}</div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div>`).join(""):`<div class="empty">공지가 없어요</div>`;
  let seen=""; try{seen=localStorage.getItem("kwSeen")||""}catch(e){}
  if(ns.length&&seen!==noticeKey()&&$("notice").hidden){$("ncnt").hidden=false;$("ncnt").textContent="N"}
  const col={}; (d.nations||[]).forEach(n=>col[n.name]=n.color);
  const ps=d.players||[];
  $("players").innerHTML=ps.length?`<div class="plist">${ps.map(p=>`<div class="pl"><img alt="" src="https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/32" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><small style="color:${p.nation?col[p.nation]||"#ccc":"#8a94a0"}">${esc(p.nation||"방랑자")}</small></div></div>`).join("")}</div>`:`<div class="empty">지금은 아무도 없어요</div>`;
  drawMarks(col);
  if(first||$("mapimg").dataset.v!==d.map){ if(d.map){$("mapimg").dataset.v=d.map;$("mapimg").src="/api/map.png?v="+encodeURIComponent(d.map)} }
}
// ---------------- 지도 (끌어서 옮기기, 휠로 확대)
let view={x:0,y:0,k:1}, fitted=false;
function apply(){$("world").style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;document.querySelectorAll(".core").forEach(m=>m.style.transform=`translate(-50%,-50%) scale(${1/view.k})`)}
function fitMap(force){
  const img=$("mapimg"), pane=$("mapPane"); if(!img.naturalWidth||pane.hidden) return; if(fitted&&!force) return;
  const k=Math.min(pane.clientWidth/img.naturalWidth,pane.clientHeight/img.naturalHeight);
  view={k,x:(pane.clientWidth-img.naturalWidth*k)/2,y:(pane.clientHeight-img.naturalHeight*k)/2}; fitted=true; apply();
}
$("mapimg").onload=()=>{fitted=false;fitMap(true);drawMarks()};
function zoomAt(f,cx,cy){const nk=Math.max(0.15,Math.min(8,view.k*f));view.x=cx-(cx-view.x)*nk/view.k;view.y=cy-(cy-view.y)*nk/view.k;view.k=nk;apply()}
$("mapPane").addEventListener("wheel",e=>{e.preventDefault();const r=$("mapPane").getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;
$("mapPane").addEventListener("pointerdown",e=>{if(e.target.closest(".mapbtns,.legend"))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};$("mapPane").classList.add("drag");$("mapPane").setPointerCapture(e.pointerId)});
$("mapPane").addEventListener("pointermove",e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;apply()});
$("mapPane").addEventListener("pointerup",()=>{drag=null;$("mapPane").classList.remove("drag")});
const mid=()=>{const p=$("mapPane");return[p.clientWidth/2,p.clientHeight/2]};
$("zin").onclick=()=>zoomAt(1.5,...mid()); $("zout").onclick=()=>zoomAt(1/1.5,...mid()); $("zfit").onclick=()=>fitMap(true);
window.addEventListener("resize",()=>fitMap(true));
function drawMarks(col){
  if(!info||!info.bounds) return; const img=$("mapimg"); if(!img.naturalWidth) return;
  col=col||{}; (info.nations||[]).forEach(n=>col[n.name]=n.color);
  const b=info.bounds, W=img.naturalWidth, H=img.naturalHeight;
  $("marks").innerHTML=(info.cores||[]).map((c,i)=>{const x=(c.x-b.minX)/b.width*W, y=(c.z-b.minZ)/b.height*H, cl=c.owner?(col[c.owner]||"#ccc"):"#8a94a0";
    return `<div class="core" data-i="${i}" style="left:${x}px;top:${y}px"><i style="background:${cl}"></i><span>${esc(c.name)}</span></div>`}).join("");
  document.querySelectorAll(".core").forEach(m=>{
    m.onpointerenter=e=>{const c=info.cores[+m.dataset.i];$("tip").style.display="block";$("tip").innerHTML=`<b>${esc(c.name)}</b><br>주인: ${esc(c.owner||"없음")}<br>체력: ${c.hp} / ${c.maxHp}<br>좌표: ${c.x}, ${c.z}`};
    m.onpointermove=e=>{const r=$("mapPane").getBoundingClientRect();$("tip").style.left=(e.clientX-r.left+14)+"px";$("tip").style.top=(e.clientY-r.top+14)+"px"};
    m.onpointerleave=()=>$("tip").style.display="none";
  });
  const owners={}; (info.cores||[]).forEach(c=>{const k=c.owner||"";owners[k]=(owners[k]||0)+1});
  $("legend").innerHTML=`<div style="color:var(--mute);margin-bottom:2px">코어 ${(info.cores||[]).length}곳</div>`+Object.keys(owners).sort().map(k=>`<div><b style="background:${k?(col[k]||"#ccc"):"#8a94a0"}"></b>${esc(k||"주인 없음")} · ${owners[k]}</div>`).join("");
  apply();
}
// ---------------- 버튼
$("play").onclick=async()=>{$("play").disabled=true;await post("/api/play");tick()};
$("disc").onclick=()=>post("/api/open",{url:discordUrl});
$("save").onclick=async()=>{await post("/api/config",{memoryMB:+$("mem").value,host:$("host").value,autoJoin:$("auto").value==="1"});filled=false;tick()};
$("folder").onclick=()=>post("/api/openfolder");
$("quit").onclick=async()=>{await post("/api/quit");document.body.innerHTML='<div style="padding:40px">런처를 껐어요. 이 창은 닫아도 돼요.</div>'};
{const t=document.querySelector(`.tab[data-t="${location.hash.slice(1)}"]`); if(t) setTimeout(()=>t.click(),50);}
tick(); setInterval(tick,1000); infoTick(); setInterval(infoTick,5000);
</script>
</body>
</html>
